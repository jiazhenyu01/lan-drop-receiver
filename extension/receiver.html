<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>局域网投送站 · 接收页</title>
    <link rel="stylesheet" href="receiver.css" />
  </head>
  <body>
    <div class="page-grid" aria-hidden="true"></div>

    <header class="page-header">
      <div class="brand-block">
        <span class="brand-index">LAN / RX-01</span>
        <h1>局域网投送站</h1>
        <p>本页面只显示当前会话记录，文件会持久保存在“文稿/局域网互传”</p>
      </div>

      <div class="session-block">
        <div class="session-overview">
          <div class="session-status">
            <span class="session-dot" id="sessionDot"></span>
            <strong id="sessionTitle">等待开启</strong>
          </div>
          <p id="sessionMessage">从浏览器工具栏打开插件并开启接收</p>
          <time id="sessionCountdown">00:00</time>
        </div>

        <section class="access-panel" id="accessPanel" hidden>
          <div class="access-qr-frame">
            <canvas id="receiverQrCanvas" aria-label="手机访问二维码"></canvas>
          </div>
          <div class="access-details">
            <span class="access-label">PHONE ENTRY</span>
            <h2>手机扫码发送</h2>
            <div class="access-address-row">
              <p class="access-url" id="receiverMobileUrl">正在获取地址…</p>
              <button id="receiverCopyUrlButton" type="button">复制地址</button>
            </div>
            <div class="access-meta">
              <p class="access-note" id="receiverNetworkNote">手机和 Mac 需要连接同一局域网</p>
              <p class="access-save-note" id="receiverSaveNote">文件保存到 ~/Documents/局域网互传</p>
            </div>
          </div>
        </section>
      </div>
    </header>

    <main>
      <section class="control-rail">
        <div>
          <span class="rail-label">RECEIVED</span>
          <strong id="receivedCount">0</strong>
          <em>ITEMS</em>
        </div>
        <button id="clearButton" type="button">清空当前内容</button>
      </section>

      <section class="items-grid" id="itemsGrid" aria-live="polite"></section>

      <section class="empty-state" id="emptyState">
        <div class="radar" aria-hidden="true">
          <span></span>
          <i></i>
        </div>
        <h2>等待局域网信号</h2>
        <p>手机发送的文本、图片和文件会出现在这里。</p>
      </section>
    </main>

    <template id="textItemTemplate">
      <article class="receive-card text-card">
        <header>
          <span class="kind-badge">TEXT</span>
          <time></time>
          <button class="delete-button" type="button">移除记录</button>
        </header>
        <pre></pre>
        <footer>
          <span class="source-label"></span>
          <button class="copy-button" type="button">复制文本</button>
        </footer>
      </article>
    </template>

    <template id="fileItemTemplate">
      <article class="receive-card file-card">
        <header>
          <span class="kind-badge"></span>
          <time></time>
          <button class="delete-button" type="button">移除记录</button>
        </header>
        <div class="image-preview" hidden>
          <img alt="" loading="lazy" />
        </div>
        <div class="file-mark" aria-hidden="true">
          <span></span>
          <strong>FILE</strong>
        </div>
        <div class="file-info">
          <h2></h2>
          <p class="file-meta"></p>
          <p class="saved-path"></p>
        </div>
        <footer>
          <span class="source-label"></span>
          <button class="reveal-button" type="button">在访达中显示</button>
        </footer>
      </article>
    </template>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <script src="vendor/qrcode.js"></script>
    <script src="receiver.js"></script>
  </body>
</html>
